name: Sync IGDB

on:
  schedule:
    # 04:23 UTC ogni notte. Minuto spostato apposta: a :00 i runner sono affollati
    # e i cron di GitHub slittano. L'ora esatta non conta, la costanza sì.
    - cron: "23 4 * * *"
  workflow_dispatch: {}

# Il job scrive data.json e history.json nel repository.
permissions:
  contents: write

concurrency:
  group: sync-igdb
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scarica da IGDB
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/sync.mjs

      - name: Committa se qualcosa è cambiato
        run: |
          if [ -z "$(git status --porcelain data.json history.json)" ]; then
            echo "Nessuna variazione."
            exit 0
          fi
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data.json history.json
          git commit -m "dati: aggiornamento $(date -u +%Y-%m-%d)"
          git push
